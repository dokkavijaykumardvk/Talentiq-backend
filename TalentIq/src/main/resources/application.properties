spring.application.name=TalentIq

server.port=${PORT:1818}

# ===============================
# Gemini AI
# ===============================
spring.ai.model.chat=google-genai

spring.ai.google.genai.api-key=${GENAI_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.response-mime-type=application/json

# ===============================
# PDF Upload
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# MySQL Database (Aiven)
# ===============================
spring.datasource.url=jdbc:mysql://talentiq-mysql-talentiq.j.aivencloud.com:17367/defaultdb?ssl-mode=REQUIRED

spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# Suppress the informational warning about having both an
# AuthenticationProvider bean and a UserDetailsService bean.
# This is intentional in this app: login() authenticates explicitly
# via AuthenticationManager, so Spring's auto-wiring choice is irrelevant.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ===============================
# Brevo Email API ( Gmail SMTP )
# ===============================
brevo.api.key=${BREVO_API_KEY}

brevo.sender.email=talentiqteam@gmail.com
brevo.sender.name=TalentIq